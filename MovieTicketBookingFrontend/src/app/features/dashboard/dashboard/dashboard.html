<div class="dashboard">

  <nav class="navbar navbar-dark bg-dark px-4">

    <a class="navbar-brand fw-bold" routerLink="/dashboard">
      <i class="bi bi-film text-danger"></i>
      MovieZone
    </a>

    <button class="btn btn-outline-light" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i>
      Logout
    </button>

  </nav>

  <div class="container py-5">

    <h2>Welcome, {{ user?.fullName }}!</h2>

    <p class="text-muted">
      Your movie booking experience starts here.
    </p>

    <div class="card shadow-sm mt-4">
      <div class="card-body">

        <h5>Your Account Details</h5>

        <p><strong>Name:</strong> {{ user?.fullName }}</p>

        <p><strong>Email:</strong> {{ user?.email }}</p>

        <p><strong>Role:</strong> {{ user?.role }}</p>

      </div>
    </div>

    <div class="mt-4">
      <h4>Movie booking features</h4>
      <p>We'll add movie browsing, show selection and seat booking in the upcoming stages.</p>
    </div>

  </div>

</div>
